<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <title>Estamos No Fundo?</title>
  <meta name="description" content="SIM ou NÃO: o Bitcoin está no fundo? Resposta diária com 11 indicadores clássicos.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://estamosnofundo.com.br/">
  <meta property="og:title" content="Estamos No Fundo?">
  <meta property="og:description" content="SIM ou NÃO: o Bitcoin está no fundo? Resposta diária com 11 indicadores clássicos.">
  <meta property="og:image" content="https://estamosnofundo.com.br/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo do Bitcoin">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://estamosnofundo.com.br/assets/og-image.png">
  <style>
    :root { color-scheme: light; }
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      text-align: center;
      padding: calc(2rem + 6vh) 1.25rem 3.5rem;
    }
    #answer {
      font-weight: 700;
      font-size: clamp(5.5rem, 23vw, 11.5rem);
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: #111;
      text-decoration: none;
      cursor: pointer;
      margin-top: 6vh;
    }
    #answer:hover,
    #answer:focus-visible {
      opacity: 0.75;
    }
    .credit {
      font-family: "Times New Roman", Times, serif;
      margin-top: 3.25rem;
      font-size: 1.3rem;
      letter-spacing: 0.01em;
    }
    .credit a {
      color: #111;
      text-decoration: none;
      border-bottom: 1px solid #111;
    }
    .credit a:hover,
    .credit a:focus-visible {
      border-bottom-width: 2px;
    }
    .cvv {
      position: fixed;
      bottom: 0.85rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: baseline;
      font-family: "Times New Roman", Times, serif;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      color: #8a8a8a;
      padding: 0 1rem;
      line-height: 1.3;
      z-index: 1;
    }
    .cvv a {
      color: #8a8a8a;
      text-decoration: none;
    }
    .cvv a:hover,
    .cvv a:focus-visible {
      color: #111;
    }
    .credit img { display:block; margin:0.75rem auto 0; border-radius:50%; }
    .credit a { border-bottom: none !important; }
  </style>
</head>
<body>
  <a id="answer" href="metodologia.html" title="Como chegamos a essa resposta">NÃO</a>
  <p class="credit">Um Oferecimento De<br><a href="https://www.opensourcelaw.com.br" aria-label="Open-Source Law+"><img src="assets/osl-logo.png" alt="Open-Source Law+" width="120" height="120"></a></p>
  <p class="cvv">
    <a href="https://cvv.org.br/chat/" target="_blank" rel="noopener" aria-label="Chat do CVV" title="Chat do CVV">Precisa conversar?</a>
  </p>
  <script>
    fetch("data/latest.json", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.answer) return;
        document.getElementById("answer").textContent = d.answer;
      })
      .catch(function () {});
  </script>
</body>
</html>
